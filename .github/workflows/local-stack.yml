name: Local stack

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start stack from a clean checkout without provider credentials
        run: docker compose up --build --wait --wait-timeout 480
      - name: Verify real local login, demo data and RLS
        run: node docker/smoke.mjs
      - name: Run tests in a clean container with no runtime network
        run: docker compose --profile test run --build --rm --no-deps tests
      - name: Collect service logs
        if: always()
        run: docker compose logs --no-color
      - name: Remove local containers and test data
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
