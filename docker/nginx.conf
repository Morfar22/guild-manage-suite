# Local development gateway. Backend services validate JWTs and enforce RLS.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8000;
  client_max_body_size 50m;
  resolver 127.0.0.11 valid=10s ipv6=off;

  location = /health {
    access_log off;
    return 200 'ok';
  }

  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
  }

  location /rest/v1/ {
    # PostgREST supplies CORS and preflight headers; do not duplicate them here.
    proxy_pass http://rest:3000/;
  }

  location /realtime/v1/ {
    proxy_pass http://realtime:4000/socket/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host realtime-dev.supabase-realtime;
    proxy_read_timeout 3600s;
  }

  location /storage/v1/ {
    proxy_pass http://storage:5000/;
  }

  # The dashboard contains the canonical migrated handlers. Resolve it lazily
  # so the gateway can start before the dashboard, avoiding a dependency cycle.
  location ~ ^/functions/v1/(.*)$ {
    set $dashboard http://dashboard:8080;
    proxy_pass $dashboard/api/public/$1$is_args$args;
    proxy_set_header Host $host;
  }
}
